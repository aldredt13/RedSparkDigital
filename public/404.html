<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | RedSpark Digital</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px;
        background: radial-gradient(ellipse at top, #3a1517 0%, #1a1112 60%); color: #f7f2f2;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
      main { max-width: 420px; }
      .code { font-size: 96px; font-weight: 700; line-height: 1; letter-spacing: -0.04em;
        background: linear-gradient(135deg, #e5484d, #ff7a7a); -webkit-background-clip: text; background-clip: text; color: transparent; }
      h1 { margin: 16px 0 8px; font-size: 22px; }
      p { margin: 0; color: #b9a9a9; line-height: 1.6; }
      a { display: inline-block; margin-top: 28px; padding: 12px 22px; border-radius: 12px; background: #e5484d;
        color: #fff; font-weight: 600; text-decoration: none; }
      a:hover { background: #f05a5f; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>This page doesn't exist</h1>
      <p>The link may be broken or the page may have moved. Let's get you back on track.</p>
      <a href="/">Go to the homepage</a>
    </main>
  </body>
</html>
